    function renderSlide(index) {

      document.getElementById('kpi-lbl').innerText = slide.kpiLabel;
      document.getElementById('slide-counter').innerText = `Slide ${slide.num} of 17`;

      const bulletsContainer = document.getElementById('slide-bullets');
      bulletsContainer.innerHTML = slide.bullets.map(b => `
        <div class="bullet-item">
          <span class="bullet-icon">⚡</span>
          <span>${b}</span>
        </div>
      `).join('');

      document.getElementById('slide-select').value = index;
      document.getElementById('progress-fill').style.width = `${((index + 1) / SLIDES.length) * 100}%`;
    }

    function nextSlide() {
      if (currentIndex < SLIDES.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function goToSlide(index) {
      currentIndex = parseInt(index);
      renderSlide(currentIndex);
    }

    // CRC32 Calculation
    function crc32(str) {
      let c = 0 ^ (-1);
      for (let i = 0; i < str.length; i++) {
        c = (c >>> 8) ^ crcTable[(c ^ str.charCodeAt(i)) & 0xFF];
      }
      return (c ^ (-1)) >>> 0;
    }
    const crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[i] = c;
    }

    // Pure JS Zip Builder (STORED Mode = 0)
    function buildZipBlob(files) {
      let localParts = [];
      let cdParts = [];
      let offset = 0;

      files.forEach(f => {
        const nameBytes = new TextEncoder().encode(f.name);
        const dataBytes = new TextEncoder().encode(f.content);
        const len = dataBytes.length;
        const crc = crc32(f.content);

        // Local Header (30 bytes)
        const lh = new Uint8Array(30 + nameBytes.length);
        const dvL = new DataView(lh.buffer);
        dvL.setUint32(0, 0x04034b50, true);
        dvL.setUint16(4, 10, true);
        dvL.setUint16(6, 0, true);
        dvL.setUint16(8, 0, true); // Stored
        dvL.setUint32(14, crc, true);
        dvL.setUint32(18, len, true);
        dvL.setUint32(22, len, true);
        dvL.setUint16(26, nameBytes.length, true);
        lh.set(nameBytes, 30);

        localParts.push(lh);
        localParts.push(dataBytes);

        // CD Header (46 bytes)
        const cd = new Uint8Array(46 + nameBytes.length);
        const dvC = new DataView(cd.buffer);
        dvC.setUint32(0, 0x02014b50, true);
        dvC.setUint16(4, 20, true);
        dvC.setUint16(6, 10, true);
        dvC.setUint16(8, 0, true);
        dvC.setUint16(10, 0, true);
        dvC.setUint32(16, crc, true);
        dvC.setUint32(20, len, true);
        dvC.setUint32(24, len, true);
        dvC.setUint16(28, nameBytes.length, true);
        dvC.setUint32(42, offset, true);
        cd.set(nameBytes, 46);

        cdParts.push(cd);
        offset += lh.length + dataBytes.length;
      });

      const cdOffset = offset;
      let cdSize = 0;
      cdParts.forEach(c => cdSize += c.length);

      // EOCD (22 bytes)
      const eocd = new Uint8Array(22);
      const dvE = new DataView(eocd.buffer);
      dvE.setUint32(0, 0x06054b50, true);
      dvE.setUint16(8, files.length, true);
      dvE.setUint16(10, files.length, true);
      dvE.setUint32(12, cdSize, true);
      dvE.setUint32(16, cdOffset, true);

      const all = [...localParts, ...cdParts, eocd];
      return new Blob(all, { type: 'application/octet-stream' });
    }

    function downloadPPTX() {
      let typesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>`;
      let presXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:presentation xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><p:sldIdLst>`;
      let presRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`;

      const files = [];

      SLIDES.forEach((s, idx) => {
        const slideNum = idx + 1;
        typesXml += `<Override PartName="/ppt/slides/slide${slideNum}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`;
        presXml += `<p:sldId id="${255 + slideNum}" r:id="rId${slideNum}"/>`;
        presRels += `<Relationship Id="rId${slideNum}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${slideNum}.xml"/>`;
        
        const bulletsText = s.bullets.map(b => `• ${b}`).join(' ');
        const slideXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sld xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:grpSpPr/></p:nvGrpSpPr><p:sp><p:nvSpPr><p:cNvPr id="2" name="Title"/><p:cSpPr/><p:nvPr/></p:nvSpPr><p:spPr/><p:txBody><a:bodyPr/><a:lstStyle/><a:p><a:r><a:t>${s.category.toUpperCase()}: ${s.title}</a:t></a:r></a:p><a:p><a:r><a:t>${s.subtitle}</a:t></a:r></a:p><a:p><a:r><a:t>${bulletsText}</a:t></a:r></a:p><a:p><a:r><a:t>KPI: ${s.kpiCallout} - ${s.kpiLabel} (Slide ${slideNum} of 17)</a:t></a:r></a:p></p:txBody></p:sp></p:spTree></p:cSld></p:sld>`;
        files.push({ name: `ppt/slides/slide${slideNum}.xml`, content: slideXml });
      });

      typesXml += `</Types>`;
      presXml += `</p:sldIdLst></p:presentation>`;
      presRels += `</Relationships>`;

      files.push({ name: '[Content_Types].xml', content: typesXml });
      files.push({ name: '_rels/.rels', content: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>` });
      files.push({ name: 'ppt/presentation.xml', content: presXml });
      files.push({ name: 'ppt/_rels/presentation.xml.rels', content: presRels });

      const blob = buildZipBlob(files);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'SkillShift_Presentation.pptx';
      a.click();
    }

    function downloadODF() {
      const files = [
        { name: 'mimetype', content: 'application/vnd.oasis.opendocument.presentation' },
        { name: 'META-INF/manifest.xml', content: `<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2"><manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.presentation"/><manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/><manifest:file-entry manifest:full-path="meta.xml" manifest:media-type="text/xml"/></manifest:manifest>` },
        { name: 'meta.xml', content: `<?xml version="1.0" encoding="UTF-8"?><office:document-meta xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:dc="http://purl.org/dc/elements/1.1/" office:version="1.2"><office:meta><dc:title>SkillShift Presentation</dc:title></office:meta></office:document-meta>` },
        { name: 'styles.xml', content: `<?xml version="1.0" encoding="UTF-8"?><office:document-styles xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" office:version="1.2"><office:styles><style:style style:name="Default" style:family="presentation"/></office:styles></office:document-styles>` }
      ];

      let slidesXml = '';
      SLIDES.forEach(s => {
        const bulletsXml = s.bullets.map(b => `<text:p>•  ${b}</text:p>`).join('');
        slidesXml += `<draw:page draw:name="Slide_${s.num}"><draw:frame><draw:text-box><text:p>${s.category.toUpperCase()}</text:p><text:h>${s.title}</text:h><text:p>${s.subtitle}</text:p>${bulletsXml}</draw:text-box></draw:frame></draw:page>`;
      });

      files.push({
        name: 'content.xml',
        content: `<?xml version="1.0" encoding="UTF-8"?><office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:draw="urn:oasis:names:tc:opendocument:xmlns:drawing:1.0" office:version="1.2"><office:body><office:presentation>${slidesXml}</office:presentation></office:body></office:document-content>`
      });

      const blob = buildZipBlob(files);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'SkillShift_Presentation.odf';
      a.click();
    }

    // Populate dropdown
    const selectEl = document.getElementById('slide-select');
    SLIDES.forEach((s, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = `Slide ${s.num}: ${s.title}`;
      selectEl.appendChild(opt);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
